name: SplitArc
options:
  deploymentTarget:
    macOS: "26.0"
  xcodeVersion: "26.0"
settings:
  base:
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: NO
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    DEVELOPMENT_TEAM: 6KV8L8WQ9D
    ENABLE_HARDENED_RUNTIME: YES
    MARKETING_VERSION: "0.3.0"
    CURRENT_PROJECT_VERSION: "4"
    CLANG_CXX_LANGUAGE_STANDARD: gnu++17
    CLANG_ENABLE_OBJC_ARC: YES
    SWIFT_VERSION: "5.0"
    CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
targets:
  SplitArc:
    type: application
    platform: macOS
    sources:
      - path: SplitArcApp
        excludes: [Info.plist, SplitArc.entitlements]
      - path: LICENSE
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.icosisenpai.splitarc
        INFOPLIST_FILE: SplitArcApp/Info.plist
        CODE_SIGN_ENTITLEMENTS: SplitArcApp/SplitArc.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: SplitArcAgent
        embed: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
      - target: SplitArcDriver
        embed: true
        copy:
          destination: wrapper
          subpath: Contents/Library/SystemExtensions
  SplitArcAgent:
    type: application
    platform: macOS
    sources:
      - path: SplitArcAgent
        excludes: [Info.plist, SplitArcAgent.entitlements]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.icosisenpai.splitarc.agent
        INFOPLIST_FILE: SplitArcAgent/Info.plist
        CODE_SIGN_ENTITLEMENTS: SplitArcAgent/SplitArcAgent.entitlements
        SKIP_INSTALL: YES
    dependencies:
      - sdk: CoreBluetooth.framework
      - sdk: IOBluetooth.framework
      - sdk: IOKit.framework
      - sdk: ApplicationServices.framework
      - sdk: Foundation.framework
  SplitArcDriver:
    type: driver-extension
    platform: macOS
    sources:
      - path: VirtualJoyConDriver
        excludes: [Info.plist, VirtualJoyConDriver.entitlements]
    settings:
      base:
        PRODUCT_NAME: "$(PRODUCT_BUNDLE_IDENTIFIER)"
        PRODUCT_BUNDLE_IDENTIFIER: dev.icosisenpai.splitarc.driver
        INFOPLIST_FILE: VirtualJoyConDriver/Info.plist
        CODE_SIGN_ENTITLEMENTS: VirtualJoyConDriver/VirtualJoyConDriver.entitlements
        SDKROOT: driverkit
        SUPPORTED_PLATFORMS: driverkit
        DRIVERKIT_DEPLOYMENT_TARGET: "25.0"
        HEADER_SEARCH_PATHS: ["$(DERIVED_SOURCES_DIR)/$(PRODUCT_BUNDLE_IDENTIFIER)", "$(SRCROOT)/VirtualJoyConDriver"]
        SHALLOW_BUNDLE: NO
        SKIP_INSTALL: YES
        OTHER_LDFLAGS: ["$(inherited)", "-framework", "DriverKit", "-framework", "HIDDriverKit"]
schemes:
  SplitArc:
    build:
      targets:
        SplitArc: all
    run:
      config: Debug
    analyze:
      config: Debug
    archive:
      config: Release
